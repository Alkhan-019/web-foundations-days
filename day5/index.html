
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - User Directory</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f7fb;
            color: #222;
        }

        h1 {
            color: #1d4ed8;
            text-align: center;
        }

        button, input {
            padding: 10px;
            margin: 8px 0;
            font-size: 16px;
            border-radius: 5px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        input {
            width: 95%;
            border: 1px solid #cbd5e1;
        }

        #status {
            font-weight: bold;
            color: #334155;
        }

        #users-list {
            padding: 0;
            list-style: none;
        }

        #users-list li {
            background: white;
            margin: 12px 0;
            padding: 16px;
            border-radius: 8px;
            border-left: 5px solid #2563eb;
            box-shadow: 0 2px 5px #00000010;
        }

        #users-list p {
            margin: 6px 0;
        }
    </style>
    <script src="users.js" defer></script>
</head>
<body>
    <h1>User Directory</h1>

    <p>Load users from the JSONPlaceholder API.</p>

    <button id="load-users">Load Users</button>

    <label for="filter-input">Filter users by name:</label>
    <input
        type="text"
        id="filter-input"
        placeholder="Type a user's name..."
    >

    <p id="status" role="status" aria-live="polite">
        Click "Load Users" to begin.
    </p>

    <ul id="users-list"></ul>
</body>
</html>
